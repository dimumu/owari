<!DOCTYPE html>
<html lang="ko">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>
    body, html, div, p, span, h1, h2, h3, h4, h5, h6, button, input, textarea {
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif !important;
    }
</style>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>일양대학교 - ILYANG UNIVERSITY</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
            }
          }
        }
      }
    </script>

    <!-- 2. Font (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
      body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
        background-color: #f8fafc;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      /* Custom utility for hiding scrollbar but allowing scroll */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(0,0,0,0.2);
        border-radius: 10px;
      }
      .writing-vertical-rl {
        writing-mode: vertical-rl;
      }
    </style>

    <!-- 3. React & Babel Setup (Import Map for Modules) -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.294.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="text-gray-800 overflow-x-hidden">
    <div id="root"></div>

    <!-- 4. MAIN SCRIPT (Contains All Components) -->
    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
            Search, Menu, Globe, ChevronDown, Wifi, 
            ChevronLeft, ChevronRight, Monitor, Building2, BookOpen, User, Map, FileText,
            X, Lock, AlertTriangle, ShieldAlert, Fingerprint, Activity, Book
        } from 'lucide-react';

        // ==========================================
        // COMPONENT: Badge
        // ==========================================
        const Badge = ({ label, colorClass }) => {
            return (
                <span className={`px-3 py-1 rounded-full text-xs font-bold tracking-wide ${colorClass} border border-white/10`}>
                    {label}
                </span>
            );
        };

        // ==========================================
        // COMPONENT: ContentOverlays
        // ==========================================
        
        // 1. LOGIN SCREEN
        const LoginOverlay = ({ onClose }) => {
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-md bg-white rounded-lg shadow-2xl overflow-hidden animate-fade-in-up">
                        <div className="bg-blue-900 p-6 text-center relative">
                            <button onClick={onClose} className="absolute top-4 right-4 text-white/50 hover:text-white transition-colors">
                                <X size={24} />
                            </button>
                            <div className="w-12 h-12 bg-white text-blue-900 mx-auto rounded flex items-center justify-center font-serif font-black text-2xl mb-3">I</div>
                            <h2 className="text-white text-lg md:text-xl font-bold tracking-tight">일양대학교 종합정보시스템</h2>
                            <p className="text-blue-200 text-sm mt-1">Ilyang University Portal System</p>
                        </div>
                        <div className="p-8 space-y-6">
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">아이디 (학번/교번)</label>
                                    <div className="relative">
                                        <User className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                                        <input type="text" placeholder="20251234" className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"/>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">비밀번호</label>
                                    <div className="relative">
                                        <Lock className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                                        <input type="password" placeholder="••••••••" className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"/>
                                    </div>
                                </div>
                            </div>
                            <button className="w-full bg-blue-800 hover:bg-blue-700 text-white font-bold py-4 rounded transition-colors shadow-lg">로그인</button>
                            <div className="flex justify-between text-xs text-gray-500 pt-2">
                                <a href="#" className="hover:text-blue-600">아이디/비밀번호 찾기</a>
                                <a href="#" className="hover:text-blue-600">신입생 학번 조회</a>
                            </div>
                        </div>
                        <div className="bg-red-50 p-4 border-t border-red-100 flex items-start gap-3">
                            <AlertTriangle className="text-red-500 flex-shrink-0" size={20} />
                            <p className="text-xs text-red-700 font-medium leading-relaxed">
                                [긴급] 현재 외부 접속이 불안정합니다. 캠퍼스 내부망을 이용 중인 재학생 및 교직원은 즉시 보안 지침을 확인하십시오.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. WORLDVIEW SCREEN
        const WorldviewOverlay = ({ onClose }) => {
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/50 backdrop-blur-md" onClick={onClose}></div>
                    <div className="relative w-full max-w-2xl bg-slate-800 border border-slate-600 rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-6 border-b border-slate-600 flex justify-between items-center bg-slate-900">
                            <div className="flex items-center gap-3">
                                <ShieldAlert className="text-red-500" size={28} />
                                <div>
                                    <h2 className="text-white text-lg md:text-xl font-bold">비상대책위원회 기록물</h2>
                                    <p className="text-gray-400 text-xs uppercase tracking-widest">Confidential / Level 4</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white">
                                <X size={24} />
                            </button>
                        </div>
                        <div className="p-8 overflow-y-auto text-gray-100 leading-relaxed space-y-6 font-mono text-sm md:text-base">
                            <div className="bg-red-950/40 border border-red-500/30 p-4 rounded text-red-100 text-sm mb-6 shadow-inner">
                                ※ 경고: 본 문서는 2025년 8월 2일부로 폐쇄된 일양대학교 내부에서 회수된 기록입니다.
                            </div>
                            <section>
                                <h3 className="text-white text-base md:text-lg font-bold mb-2 flex items-center gap-2">
                                    <span className="w-1 h-6 bg-blue-500 block"></span> 1. 사건 개요
                                </h3>
                                <p>
                                    2025년 8월, 하계 계절학기 기말고사 기간 중 교내 보건실에서 최초 감염자 발생. 
                                    초기에는 '식중독'으로 오인되었으나, 발열 시작 10분 이내에 폭력성 발현 및 신체 괴사가 관찰됨.
                                    <span className="text-red-300 font-bold ml-1">현재 교내 생존자 수는 극히 적은 것으로 추정됨.</span><br/>
                                    <span className="text-blue-300 text-xs md:text-sm block mt-2 opacity-80">
                                        * 통신 현황: 기지국 붕괴로 음성 통화 불가. 단, '일양대타임' 앱 접속 및 단문 메시지(SMS)는 간헐적으로 송수신 가능.
                                    </span>
                                </p>
                            </section>
                            <section>
                                <h3 className="text-white text-base md:text-lg font-bold mb-2 flex items-center gap-2">
                                    <span className="w-1 h-6 bg-blue-500 block"></span> 2. 캠퍼스 현황
                                </h3>
                                <ul className="space-y-4 text-sm">
                                    <li className="bg-slate-700/50 p-3 rounded border-l-4 border-red-500">
                                        <strong className="text-white block text-base mb-1">본관 (학생처)</strong>
                                        평소 자퇴를 위해 7개 면담실을 돌아야 해 '자퇴 포기 코스'라 불리던 복도. 현재는 감염된 교직원들이 빽빽하게 배회하는 <span className="text-red-300">'생존 포기 코스'</span>가 됨. 진입 절대 불가.
                                    </li>
                                    <li className="bg-slate-700/50 p-3 rounded border-l-4 border-yellow-500">
                                        <strong className="text-white block text-base mb-1">학생회관</strong>
                                        편의점과 식당이 있어 초기 생존자들이 모였던 흔적이 있음. 현재는 인기척이 끊겼으며, 내부에 감염자가 배회하는지 생존자가 숨죽이고 있는지 확인할 수 없음.
                                    </li>
                                    <li className="bg-slate-700/30 p-3 rounded border-l-4 border-slate-500 opacity-80">
                                        <strong className="text-gray-300 block text-base mb-1">공학관</strong>
                                        [정보 없음] 내부 상황 파악 불가. 출입구 봉쇄됨.
                                    </li>
                                    <li className="bg-slate-700/30 p-3 rounded border-l-4 border-slate-500 opacity-80">
                                        <strong className="text-gray-300 block text-base mb-1">예술관</strong>
                                        [정보 없음] 내부 상황 파악 불가. 일부 창문에 로프가 매달려있음.
                                    </li>
                                    <li className="bg-slate-700/30 p-3 rounded border-l-4 border-slate-500 opacity-80">
                                        <strong className="text-gray-300 block text-base mb-1">목양관 (인문대)</strong>
                                        [정보 없음] 내부 상황 파악 불가. 간혹 인기척이 들림.
                                    </li>
                                    <li className="bg-slate-700/50 p-3 rounded border-l-4 border-red-900">
                                        <strong className="text-white block text-base mb-1">기숙사 (1생활관)</strong>
                                        최초 감염 확산지. 좁은 복도 구조 특성상 대피가 불가능했던 것으로 추정. 내부 진입 시도 자체가 자살 행위로 간주됨.
									</li>
                                </ul>
                            </section>
                        </div>
                        <div className="p-4 bg-slate-900 border-t border-slate-700 text-center">
                            <button onClick={onClose} className="px-8 py-2 bg-blue-900 hover:bg-blue-800 text-white text-sm font-bold rounded transition-colors">기록 닫기</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. PROFILE SCREEN
        const ProfileOverlay = ({ onClose, profileId }) => {
            const getProfileData = (id) => {
                switch (id) {
                    case 'profile_1':
                        return {
                            name: "염주호",
                            img: "https://raw.githubusercontent.com/dimumu/owari/refs/heads/main/portrait(1).webp",
                            dept: "고분자공학과",
                            id: "2023110106",
                            dob: "11.24",
                            age: "23세",
                            status: "1학년 (복학/군필)",
                            appearance: ["수더분하게 기른 검은 머리카락", "화려한 이목구비와 진한 눈매", "주홍색 눈동자", "키 182cm, 마른 체형, 넓은 어깨"],
                            personality: ["즉흥적이고 도발적인 사고방식", "위험을 '별일 아닌 일'로 인식", "도덕적 유연성 (Moral Flexibility)", "육체적 친밀감보다 감정적 합의 중시"],
                            noteTitle: "Behavior Patterns",
                            noteContent: ["손톱 물어뜯기, 생각하는 동안 제자리를 빙글빙글 돌음", "모든 행동 템포가 느리고 여유로움", "지루함이 임계에 달하면 돌발 행동", "타인의 개인 공간 침범에 거리낌 없음"],
                            warning: "Warning: Risk-Seeking Trait Detected"
                        };
                    case 'profile_2':
                        return {
                            name: "김시형",
                            img: "https://raw.githubusercontent.com/dimumu/owari/refs/heads/main/portrait(2).webp",
                            dept: "사회기술융합공학과",
                            id: "2023110203",
                            dob: "--.--",
                            age: "23세",
                            status: "3학년 (미필)",
                            appearance: ["흑발", "벽안 (삼백안)", "귀여운 얼굴", "오른쪽 뺨 점 2개", "키 173cm"],
                            personality: ["약삭빠른 기회주의자", "가벼운 성격, 사람을 좋아함", "호감 대상 앞에서 수줍음", "도벽 성향 있음", "연민과 동정을 적극 수용"],
                            noteTitle: "Additional Notes",
                            noteContent: ["압도적인 행운", "경쟁 게임 챌린저"],
                            warning: null
                        };
                    case 'profile_3':
                        return {
                            name: "문선주",
                            img: "https://raw.githubusercontent.com/dimumu/owari/refs/heads/main/portrait(3).webp",
                            dept: "조소과",
                            id: "2019120318",
                            dob: "--.--",
                            age: "26세",
                            status: "4학년",
                            appearance: ["흑발", "흑안", "깔끔한 인상", "키 186cm"],
                            personality: ["현실주의적이며 냉소적", "은근한 장난끼", "마지못해 나서는 중재자", "갈등 상황에 민감함"],
                            noteTitle: "Additional Notes",
                            noteContent: ["타 집단과의 긴장을 경계함"],
                            warning: null
                        };
                    default:
                        return {
                            name: "신원 미상",
                            img: "https://placehold.co/600x800/gray/white?text=No+Data",
                            dept: "정보 없음",
                            id: "--------",
                            dob: "--. --.",
                            age: "미상",
                            status: "생사 불명",
                            appearance: ["데이터 없음"],
                            personality: ["데이터 없음"],
                            noteTitle: "Additional Notes",
                            noteContent: ["데이터 없음"],
                            warning: null
                        };
                }
            };

            const profileData = getProfileData(profileId);

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/70 backdrop-blur-md" onClick={onClose}></div>
                    <div className="relative w-full max-w-4xl max-h-[90vh] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row animate-fade-in-up">
                        <button onClick={onClose} className="absolute top-4 right-4 z-20 text-black/50 hover:text-black bg-white/90 backdrop-blur rounded-full p-2 shadow-lg transition-colors border border-white/20">
                            <X size={20} />
                        </button>
                        <div className="w-full md:w-[45%] h-96 md:h-auto bg-gray-200 relative flex-shrink-0">
                            <img src={profileData.img} alt={profileData.name} className="w-full h-full object-cover object-top" />
                            <div className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/90 via-black/50 to-transparent p-6 pt-20">
                                <h2 className="text-white text-3xl font-black tracking-tight">{profileData.name}</h2>
                                <p className="text-blue-300 font-medium tracking-wider text-sm mt-1 uppercase">Survivor Record</p>
                            </div>
                        </div>
                        <div className="flex-1 bg-white overflow-y-auto custom-scrollbar">
                            <div className="p-8 pb-12">
                                <div className="mb-8">
                                    <h3 className="flex items-center gap-2 text-sm font-bold text-blue-900 uppercase tracking-widest border-b-2 border-blue-900 pb-2 mb-4">
                                        <Fingerprint size={16} /> Student Information
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-6 text-sm">
                                        <div className="flex flex-col border-b border-gray-100 pb-2"><span className="text-gray-400 font-bold text-xs mb-1">이름</span><span className="text-gray-900 font-bold text-lg">{profileData.name}</span></div>
                                        <div className="flex flex-col border-b border-gray-100 pb-2"><span className="text-gray-400 font-bold text-xs mb-1">생년월일</span><span className="text-gray-900 font-medium">{profileData.dob} <span className="text-gray-400 text-xs ml-1">({profileData.age})</span></span></div>
                                        <div className="flex flex-col border-b border-gray-100 pb-2"><span className="text-gray-400 font-bold text-xs mb-1">소속 학과</span><span className="text-gray-900 font-bold">{profileData.dept}</span></div>
                                        <div className="flex flex-col border-b border-gray-100 pb-2"><span className="text-gray-400 font-bold text-xs mb-1">학번</span><span className="text-blue-700 font-mono font-bold text-lg tracking-wider">{profileData.id}</span></div>
                                    </div>
                                </div>
                                <div className="mb-8">
                                    <h3 className="flex items-center gap-2 text-sm font-bold text-gray-900 uppercase tracking-widest bg-gray-100 p-2 rounded mb-4">
                                        <User size={16} /> Visual Profile
                                    </h3>
                                    <div>
                                        <span className="block text-xs font-bold text-gray-500 mb-2">핵심 인상</span>
                                        <div className="flex flex-wrap gap-2">
                                            {profileData.appearance.map((item, idx) => (
                                                <span key={idx} className="bg-gray-50 text-gray-700 border border-gray-200 px-3 py-1.5 rounded text-xs font-medium">{item}</span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="mb-8">
                                    <h3 className="flex items-center gap-2 text-sm font-bold text-gray-900 uppercase tracking-widest bg-gray-100 p-2 rounded mb-4">
                                        <Activity size={16} /> Psycho-Analysis
                                    </h3>
                                    <ul className="space-y-2">
                                        {profileData.personality.map((item, idx) => (
                                            <li key={idx} className="flex items-start gap-2 text-sm text-gray-700">
                                                <span className="w-1.5 h-1.5 bg-blue-500 rounded-full mt-1.5 flex-shrink-0"></span>
                                                <span className={idx === 0 ? "font-bold text-blue-800" : ""}>{item}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                <div>
                                    <h3 className="flex items-center gap-2 text-sm font-bold text-gray-900 uppercase tracking-widest bg-gray-100 p-2 rounded mb-4">
                                        <Book size={16} /> {profileData.noteTitle}
                                    </h3>
                                    <div className="bg-red-50 border-l-4 border-red-400 p-4 rounded-r">
                                        <ul className="space-y-2">
                                            {profileData.noteContent.map((item, idx) => (
                                                <li key={idx} className="text-xs md:text-sm text-gray-800 leading-relaxed">- {item}</li>
                                            ))}
                                        </ul>
                                        {profileData.warning && (
                                            <div className="mt-3 pt-3 border-t border-red-100 text-[10px] text-red-600 font-bold uppercase tracking-widest">{profileData.warning}</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // COMPONENT: QuickMenu
        // ==========================================
        const QuickMenu = ({ onNavigate }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('학부생');
            const tabs = ['예비대학생', '학부생', '교직원'];

            const profiles = [
                { id: 'profile_1', dept: '고분자공학과', name: '염주호', thumb: 'https://raw.githubusercontent.com/dimumu/owari/refs/heads/main/%EC%97%BC%EC%A3%BC%ED%98%B8%20%EC%B9%98%EB%B9%84.webp' },
                { id: 'profile_2', dept: '사회기술융합공학과', name: '김시형', thumb: 'https://raw.githubusercontent.com/dimumu/owari/refs/heads/main/%EA%B9%80%EC%8B%9C%ED%98%95%20%EC%B9%98%EB%B9%84.webp' },
                { id: 'profile_3', dept: '조소과', name: '문선주', thumb: 'https://raw.githubusercontent.com/dimumu/owari/refs/heads/main/%EB%AC%B8%EC%84%A0%EC%A3%BC%20%EC%B9%98%EB%B9%84.webp' }
            ];

            return (
                <>
                    <div className={`fixed inset-0 bg-black/40 z-40 transition-opacity duration-500 ${isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsOpen(false)} />
                    <div className="fixed inset-y-0 right-0 z-50 flex items-center pointer-events-none">
                        <div className={`pointer-events-auto h-full flex items-center transition-transform duration-500 ease-in-out ${isOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                            <div className="absolute left-0 bottom-24 md:top-1/2 md:bottom-auto -translate-x-full md:-translate-y-1/2">
                                <button onClick={() => setIsOpen(!isOpen)} className={`flex items-center justify-center bg-blue-800 text-white w-12 h-16 md:h-24 rounded-l-xl shadow-lg hover:bg-blue-700 transition-colors border-y border-l border-white/20 ${!isOpen && 'animate-pulse'}`}>
                                    <div className="flex flex-col items-center gap-1">
                                        {isOpen ? <ChevronRight size={24} /> : <ChevronLeft size={24} />}
                                        <span className="text-[10px] md:text-xs font-bold writing-vertical-rl transform rotate-180 tracking-widest">{isOpen ? 'CLOSE' : 'OPEN'}</span>
                                    </div>
                                </button>
                            </div>
                            <div className="w-[85vw] sm:w-[400px] md:w-[480px] h-full bg-gradient-to-br from-blue-600 to-blue-500 shadow-2xl flex flex-col text-white overflow-y-auto border-l border-white/10">
                                <div className="p-6 md:p-8 pb-4">
                                    <div className="grid grid-cols-2 gap-4 mb-8">
                                        <button onClick={() => onNavigate('login')} className="flex items-center justify-between bg-blue-700/50 hover:bg-blue-700 border border-blue-400/30 p-4 rounded-lg transition-all group">
                                            <span className="font-bold text-base md:text-lg text-left">종합정보<br/>시스템</span>
                                            <div className="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white text-blue-600 flex items-center justify-center font-black text-[10px] md:text-xs group-hover:scale-110 transition-transform">GO</div>
                                        </button>
                                        <button className="flex items-center justify-between bg-blue-700/50 hover:bg-blue-700 border border-blue-400/30 p-4 rounded-lg transition-all group">
                                            <span className="font-bold text-base md:text-lg text-left">사이버<br/>캠퍼스</span>
                                            <div className="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white text-blue-600 flex items-center justify-center font-black text-[10px] md:text-xs group-hover:scale-110 transition-transform">GO</div>
                                        </button>
                                    </div>
                                    <div className="flex justify-start gap-4 md:gap-6 border-b border-blue-400/30 pb-4 mb-6 relative">
                                        {tabs.map((tab) => (
                                            <button key={tab} onClick={() => setActiveTab(tab)} className={`text-base md:text-lg font-bold transition-all relative z-10 ${activeTab === tab ? 'text-white scale-105' : 'text-blue-300 hover:text-blue-100'}`}>
                                                {tab}
                                                {activeTab === tab && <div className="absolute -bottom-4 left-0 w-full h-1 bg-white rounded-t-full shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-4 gap-y-6 md:gap-y-8 gap-x-2 md:gap-x-4 text-center mb-8 animate-fade-in">
                                        {[ { icon: Monitor, label: '포털시스템' }, { icon: Building2, label: '입학안내' }, { icon: Wifi, label: '통학버스' }, { icon: BookOpen, label: '도서관' } ].map((item, idx) => (
                                            <div key={idx} className="flex flex-col items-center gap-2 group cursor-pointer">
                                                <div className="w-12 h-12 md:w-14 md:h-14 rounded-2xl border border-blue-400/30 flex items-center justify-center text-white group-hover:bg-white group-hover:text-blue-600 transition-all">
                                                    <item.icon size={24} className="md:w-7 md:h-7" strokeWidth={1.5} />
                                                </div>
                                                <span className="text-xs md:text-base font-medium tracking-tight opacity-90 group-hover:opacity-100">{item.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 px-6 md:px-8 space-y-4">
                                    <div onClick={() => onNavigate('worldview')} className="bg-blue-800/40 border border-blue-400/30 rounded-xl p-4 hover:bg-blue-800/60 transition-colors cursor-pointer group">
                                        <div className="flex items-start gap-4">
                                            <div className="w-12 h-12 md:w-14 md:h-14 bg-blue-900 rounded-lg flex items-center justify-center flex-shrink-0 border border-white/10 group-hover:border-white/40 shadow-inner">
                                                <Map className="text-blue-300" />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-lg md:text-xl mb-1 group-hover:text-blue-200">세계관 설정</h4>
                                                <p className="text-sm md:text-base text-blue-200 line-clamp-2 leading-relaxed opacity-90">2025년 8월, 캠퍼스 폐쇄 명령. <br/>대학가에 고립된 우리들.</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="border-t border-blue-400/20 my-4"></div>
                                    {profiles.map((profile) => (
                                        <div key={profile.id} onClick={() => onNavigate(profile.id)} className="bg-blue-800/20 border border-blue-400/10 rounded-xl p-4 hover:bg-blue-800/40 transition-colors cursor-pointer group flex items-center gap-5">
                                            <div className="w-16 h-16 md:w-20 md:h-20 rounded-full bg-white/10 flex-shrink-0 overflow-hidden border-2 border-white/20 group-hover:border-white/60 transition-colors shadow-md relative">
                                                <img src={profile.thumb} alt={profile.name} className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-300" />
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex justify-between items-start mb-1">
                                                    <div className="flex flex-col">
                                                        <h5 className="font-bold text-lg md:text-xl text-white leading-tight">{profile.name}</h5>
                                                        <span className="text-blue-300 text-xs md:text-sm font-medium mt-1">{profile.dept}</span>
                                                    </div>
                                                    <FileText size={18} className="text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity mt-1" />
                                                </div>
                                                <div className="mt-2 flex items-center gap-2">
                                                    <span className="text-[10px] md:text-xs text-blue-200/80 bg-blue-900/40 px-2 py-0.5 rounded border border-blue-500/20">생존 확인됨</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-blue-900/40 p-6 backdrop-blur-sm mt-8 border-t border-blue-500/20">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-xl md:text-2xl font-bold flex items-center">학사일정 <span className="text-blue-300 ml-2 font-light">+</span></h3>
                                        <button className="flex items-center text-base md:text-lg font-bold hover:text-blue-300">2025.08 <ChevronRight size={18} /></button>
                                    </div>
                                    <div className="space-y-4 font-mono text-sm md:text-base">
                                        <div className="flex flex-col gap-1">
                                            <span className="text-red-300 font-bold">08.02 (토)</span>
                                            <p className="font-bold text-red-200 animate-pulse bg-red-900/50 px-2 py-0.5 rounded w-fit">긴급: 캠퍼스 폐쇄</p>
                                        </div>
                                        <div className="flex flex-col gap-1 opacity-60">
                                            <span className="text-blue-200">08.18 (월) ~ 08.22 (금)</span>
                                            <p className="line-through decoration-red-400 decoration-2 text-white/80">2학기 수강신청 기간</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        // ==========================================
        // COMPONENT: App (Main)
        // ==========================================
        const App = () => {
            const [currentView, setCurrentView] = useState('home');

            const handleNavigate = (page) => {
                setCurrentView(page);
            };

            const handleCloseOverlay = () => {
                setCurrentView('home');
            };

            return (
                <div className="relative min-h-screen bg-white">
                    {currentView === 'login' && <LoginOverlay onClose={handleCloseOverlay} />}
                    {currentView === 'worldview' && <WorldviewOverlay onClose={handleCloseOverlay} />}
                    {currentView.startsWith('profile_') && <ProfileOverlay onClose={handleCloseOverlay} profileId={currentView} />}

                    <header className="fixed top-0 left-0 w-full z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 transition-all">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentView('home')}>
                                <div className="w-8 h-8 bg-blue-700 rounded-sm flex items-center justify-center text-white font-serif font-black">I</div>
                                <div className="flex flex-col leading-none">
                                    <span className="text-xl font-black text-blue-900 tracking-tight">일양대학교</span>
                                    <span className="text-[0.65rem] text-blue-600 font-medium tracking-widest uppercase">Ilyang University</span>
                                </div>
                            </div>
                            <nav className="hidden md:flex items-center gap-10 font-bold text-xl text-gray-800">
                                {['대학소개', '입학안내', '대학기관', '학사정보', '대학생활'].map((item) => (
                                    <a key={item} href="#" className="hover:text-blue-700 transition-colors relative group py-6">
                                        {item}
                                        <span className="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-700 group-hover:w-full transition-all duration-300"></span>
                                    </a>
                                ))}
                            </nav>
                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-50 border border-green-200 text-green-700 text-xs font-bold tracking-tight">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                    SYSTEM ONLINE
                                </div>
                                <button className="hidden md:flex items-center gap-1 text-xs font-bold text-gray-400 hover:text-blue-600"><Globe size={14} /> ENG</button>
                                <button className="p-2 hover:bg-gray-100 rounded-full transition-colors"><Search size={20} className="text-gray-600" /></button>
                                <button className="md:hidden p-2 hover:bg-gray-100 rounded-full transition-colors"><Menu size={24} className="text-gray-800" /></button>
                            </div>
                        </div>
                    </header>

                    <main className="relative w-full h-screen overflow-hidden pt-20">
                        <div className="absolute inset-0 z-0">
                            <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2070&auto=format&fit=crop" alt="Ilyang Campus Winter" className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-blue-900/20 mix-blend-multiply"></div>
                        </div>
                        <div className="relative z-10 h-full max-w-7xl mx-auto px-6 md:px-8 flex flex-col justify-center">
                            <div className="space-y-4 animate-fade-in-up">
                                <span className="inline-block px-3 py-1 bg-blue-600 text-white text-xs font-bold tracking-wider uppercase mb-2">Global Leader</span>
                                <h1 className="text-3xl md:text-7xl font-black text-white leading-tight drop-shadow-lg">오늘의 <span className="text-blue-200">일양</span>,<br/>내일의 대한민국</h1>
                                <p className="text-white/90 text-base md:text-xl font-light max-w-xl leading-relaxed drop-shadow-md">창의적 지성과 따뜻한 인성을 겸비한<br/>미래 사회의 리더를 양성합니다.</p>
                                <div className="pt-8 flex gap-4">
                                    <button className="px-6 py-2 md:px-8 md:py-3 text-sm md:text-base bg-white text-blue-900 font-bold rounded hover:bg-blue-50 transition-colors shadow-lg flex items-center gap-2">
                                        모집요강 확인하기 <ChevronDown size={16} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>

                    <QuickMenu onNavigate={handleNavigate} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
